<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="olLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e9172"/>
      <stop offset="50%" stop-color="#55694a"/>
      <stop offset="100%" stop-color="#3b4d32"/>
    </linearGradient>
    <linearGradient id="olTwig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c7d67"/>
      <stop offset="100%" stop-color="#5a4e3c"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 20)">
    <!-- Gentle curved stem -->
    <path d="M 20 160 Q 120 120, 260 40" fill="none" stroke="url(#olTwig)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Paired Olive leaves -->
    <!-- Pair 1 -->
    <path d="M 60 145 C 50 115, 65 95, 80 90 C 85 110, 75 135, 60 145 Z" fill="url(#olLeaf)" opacity="0.9"/>
    <path d="M 70 142 C 90 155, 110 165, 120 180 C 105 180, 85 165, 70 142 Z" fill="url(#olLeaf)" opacity="0.85"/>

    <!-- Pair 2 -->
    <path d="M 115 120 C 105 90, 125 70, 140 65 C 145 85, 135 110, 115 120 Z" fill="url(#olLeaf)" opacity="0.92"/>
    <path d="M 125 118 C 145 130, 165 140, 180 155 C 160 155, 145 140, 125 118 Z" fill="url(#olLeaf)" opacity="0.88"/>

    <!-- Pair 3 -->
    <path d="M 175 90 C 170 60, 190 45, 205 40 C 210 60, 195 80, 175 90 Z" fill="url(#olLeaf)" opacity="0.9"/>
    <path d="M 185 88 C 210 100, 225 110, 240 120 C 220 125, 200 110, 185 88 Z" fill="url(#olLeaf)" opacity="0.85"/>

    <!-- Terminal tip leaf -->
    <path d="M 260 40 C 280 30, 295 32, 290 48 C 275 52, 265 48, 260 40 Z" fill="url(#olLeaf)" opacity="0.95"/>

    <!-- Tiny olive fruit -->
    <ellipse cx="120" cy="132" rx="4.5" ry="6.5" transform="rotate(20 120 132)" fill="#394231"/>
    <ellipse cx="178" cy="100" rx="4" ry="6" transform="rotate(-15 178 100)" fill="#444d3b"/>
  </g>
</svg>

