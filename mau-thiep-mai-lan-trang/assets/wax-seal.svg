<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Organic drop shadow for realistic 3D wax depth -->
    <filter id="waxShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#212a1d" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.22"/>
    </filter>

    <!-- Olive green wax gradient -->
    <linearGradient id="waxGrad" x1="25%" y1="15%" x2="75%" y2="85%">
      <stop offset="0%" stop-color="#5f6e56"/>
      <stop offset="35%" stop-color="#4d5c45"/>
      <stop offset="70%" stop-color="#3d4c36"/>
      <stop offset="100%" stop-color="#2a3525"/>
    </linearGradient>

    <!-- Inner embossed ring light & dark -->
    <linearGradient id="embossLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73846a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#4a5943" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#253021" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#e8dfce"/>
      <stop offset="100%" stop-color="#c5b9a2"/>
    </linearGradient>
  </defs>

  <!-- Wax puddle base (organic, slightly uneven rim) -->
  <path d="M100 12 C132 10, 162 25, 178 50 C194 76, 191 114, 176 142 C161 170, 131 189, 99 188 C66 187, 33 171, 18 143 C3 115, 6 78, 23 51 C40 24, 69 13, 100 12 Z" 
        fill="url(#waxGrad)" 
        filter="url(#waxShadow)" />

  <!-- Inner melted rim depression -->
  <circle cx="100" cy="100" r="74" fill="#3f4e38" opacity="0.6"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#embossLight)" stroke-width="3" opacity="0.8"/>
  <circle cx="100" cy="100" r="66" fill="none" stroke="#2c3627" stroke-width="1.5" stroke-dasharray="2,3"/>

  <!-- Embossed White Magnolia / Olive Crest in center -->
  <g transform="translate(100, 98) scale(0.85)" text-anchor="middle">
    <!-- Magnolia Petals & Leaves -->
    <path d="M0 -42 C8 -32, 12 -20, 0 -6 C-12 -20, -8 -32, 0 -42 Z" fill="url(#goldStem)" opacity="0.95"/>
    <path d="M-4 -24 C-18 -26, -26 -16, -18 -6 C-10 4, -4 -10, -4 -24 Z" fill="url(#goldStem)" opacity="0.85"/>
    <path d="M4 -24 C18 -26, 26 -16, 18 -6 C10 4, 4 -10, 4 -24 Z" fill="url(#goldStem)" opacity="0.85"/>
    
    <!-- Central bud & stem -->
    <path d="M0 -6 C-2 10, 2 26, 0 38" stroke="url(#goldStem)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Delicate Side Leaves -->
    <path d="M0 6 C-14 4, -18 16, -8 18 C-1 19, 0 10, 0 6 Z" fill="url(#goldStem)" opacity="0.8"/>
    <path d="M0 16 C14 14, 18 26, 8 28 C1 29, 0 20, 0 16 Z" fill="url(#goldStem)" opacity="0.8"/>
    <path d="M0 26 C-12 26, -14 34, -6 36 C-1 37, 0 30, 0 26 Z" fill="url(#goldStem)" opacity="0.75"/>
    
    <!-- Small elegant letters A & A -->
    <text x="0" y="52" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="12" font-weight="600" fill="#fdfbf7" letter-spacing="3" opacity="0.9">A &amp; A</text>
  </g>
</svg>

