  <circle cx="678" cy="92" r="8" fill="#95D5B2" opacity="0.55"/>
  <circle cx="702" cy="93" r="8" fill="#D8F3DC" opacity="0.5"/>
  <circle cx="690" cy="82" r="7" fill="#B7E4C7" opacity="0.5"/>
