  <ellipse cx="15" cy="145" rx="30" ry="14" fill="#74C69D" opacity="0.3" transform="rotate(-55 15 145)"/>
  
  <!-- Left ferns -->
  <path d="M0 300 Q30 240 70 200 Q100 165 120 120" stroke="#52B788" stroke-width="2" fill="none" opacity="0.5"/>
