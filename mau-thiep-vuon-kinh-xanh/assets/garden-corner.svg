<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Large monstera leaf -->
  <ellipse cx="80" cy="320" rx="90" ry="55" fill="#2D6A4F" opacity="0.55" transform="rotate(-30 80 320)"/>
  <ellipse cx="80" cy="320" rx="60" ry="35" fill="#40916C" opacity="0.4" transform="rotate(-30 80 320)"/>
  <!-- Holes in monstera -->
  <ellipse cx="95" cy="300" rx="12" ry="8" fill="white" opacity="0.6" transform="rotate(-30 95 300)"/>
  <ellipse cx="65" cy="330" rx="10" ry="7" fill="white" opacity="0.6" transform="rotate(-30 65 330)"/>
  <!-- Monstera stem -->
  <line x1="80" y1="380" x2="80" y2="320" stroke="#1B4332" stroke-width="3" opacity="0.6"/>
  
  <!-- Fern frond 1 -->
  <path d="M20 380 Q60 320 120 280" stroke="#52B788" stroke-width="2.5" fill="none" opacity="0.7"/>
  <ellipse cx="50" cy="350" rx="14" ry="6" fill="#52B788" opacity="0.5" transform="rotate(-55 50 350)"/>
  <ellipse cx="75" cy="325" rx="12" ry="5" fill="#52B788" opacity="0.5" transform="rotate(-55 75 325)"/>
  <ellipse cx="100" cy="302" rx="10" ry="4" fill="#52B788" opacity="0.5" transform="rotate(-55 100 302)"/>
  
  <!-- Fern frond 2 -->
  <path d="M0 350 Q50 290 110 250" stroke="#74C69D" stroke-width="2" fill="none" opacity="0.5"/>
  <ellipse cx="35" cy="315" rx="11" ry="4.5" fill="#74C69D" opacity="0.4" transform="rotate(-58 35 315)"/>
  <ellipse cx="65" cy="288" rx="9" ry="4" fill="#74C69D" opacity="0.4" transform="rotate(-58 65 288)"/>
  <ellipse cx="90" cy="265" rx="8" ry="3.5" fill="#74C69D" opacity="0.4" transform="rotate(-58 90 265)"/>
  
  <!-- Tropical leaf top -->
  <ellipse cx="180" cy="40" rx="80" ry="45" fill="#1B4332" opacity="0.45" transform="rotate(20 180 40)"/>
  <ellipse cx="180" cy="40" rx="50" ry="28" fill="#2D6A4F" opacity="0.35" transform="rotate(20 180 40)"/>
  <line x1="130" y1="20" x2="230" y2="60" stroke="#081C15" stroke-width="2.5" opacity="0.5"/>
  
  <!-- Small orchid flowers -->
  <circle cx="160" cy="200" r="8" fill="#B7E4C7" opacity="0.6"/>
  <circle cx="155" cy="195" r="5" fill="#D8F3DC" opacity="0.7"/>
  <circle cx="165" cy="205" r="5" fill="#D8F3DC" opacity="0.7"/>
  <circle cx="158" cy="207" r="4" fill="#95D5B2" opacity="0.8"/>
  
  <circle cx="300" cy="100" r="7" fill="#B7E4C7" opacity="0.5"/>
  <circle cx="295" cy="96" r="4.5" fill="#D8F3DC" opacity="0.65"/>
  <circle cx="305" cy="104" r="4.5" fill="#D8F3DC" opacity="0.65"/>
  
  <!-- Vine tendrils -->
  <path d="M0 200 Q40 170 60 120 Q80 70 120 50" stroke="#52B788" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M10 230 Q50 200 80 160 Q110 120 150 100" stroke="#74C69D" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Small leaves along vine -->
  <ellipse cx="55" cy="140" rx="10" ry="5" fill="#52B788" opacity="0.45" transform="rotate(-70 55 140)"/>
  <ellipse cx="90" cy="105" rx="9" ry="4" fill="#52B788" opacity="0.45" transform="rotate(-65 90 105)"/>
  <ellipse cx="125" cy="75" rx="8" ry="3.5" fill="#40916C" opacity="0.45" transform="rotate(-60 125 75)"/>
  
  <!-- Glass/dew drops effect -->
  <circle cx="200" cy="250" r="4" fill="white" opacity="0.3"/>
  <circle cx="130" cy="180" r="3" fill="white" opacity="0.25"/>
  <circle cx="260" cy="150" r="3.5" fill="white" opacity="0.25"/>
</svg>

